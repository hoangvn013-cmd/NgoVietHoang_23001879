<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bài 3 - Quản lý công việc</title>
<script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
<style>
  body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 30px; }
  .box { background: #fff; padding: 24px; border-radius: 10px; width: 440px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  input[type=text] { padding: 7px; width: 270px; }
  button { padding: 6px 12px; cursor: pointer; }
  .active { background: #1976d2; color: #fff; border: 1px solid #1976d2; }
  ul { padding: 0; list-style: none; }
  li { padding: 8px 0; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; }
  li span { flex: 1; }
  .done { text-decoration: line-through; color: #999; }
  .error { color: red; font-size: 13px; }
  .empty { color: #777; text-align: center; }
</style>
</head>
<body>
<div id="app" class="box">
  <h2>Công việc trong ngày</h2>

  <input type="text" v-model="newTask" @keyup.enter="addTask" placeholder="Nhập công việc...">
  <button @click="addTask">Thêm</button>
  <div class="error" v-if="error">{{ error }}</div>

  <p>
    <button :class="{ active: filter === 'all' }" @click="filter = 'all'">Tất cả</button>
    <button :class="{ active: filter === 'todo' }" @click="filter = 'todo'">Chưa hoàn thành</button>
    <button :class="{ active: filter === 'done' }" @click="filter = 'done'">Đã hoàn thành</button>
  </p>

  <ul v-if="filteredTasks.length">
    <li v-for="task in filteredTasks" :key="task.id">
      <input type="checkbox" v-model="task.done">
      <span :class="{ done: task.done }">{{ task.title }}</span>
      <button @click="removeTask(task.id)">Xóa</button>
    </li>
  </ul>
  <p class="empty" v-else>{{ tasks.length ? 'Không có công việc nào phù hợp.' : 'Chưa có công việc nào.' }}</p>

  <p>Tổng: {{ total }} việc | Chưa hoàn thành: {{ remaining }}</p>
  <button @click="clearDone">Xóa các việc đã hoàn thành</button>
</div>

<script>
  Vue.createApp({
    data() {
      return {
        tasks: [
          { id: 1, title: "Học Vue.js", done: false },
          { id: 2, title: "Làm bài tập số 6", done: true }
        ],
        nextId: 3,
        newTask: "",
        error: "",
        filter: "all"
      };
    },
    computed: {
      total() { return this.tasks.length; },
      remaining() { return this.tasks.filter(t => !t.done).length; },
      filteredTasks() {
        if (this.filter === "todo") return this.tasks.filter(t => !t.done);
        if (this.filter === "done") return this.tasks.filter(t => t.done);
        return this.tasks;
      }
    },
    methods: {
      addTask() {
        const title = this.newTask.trim();
        if (!title) {
          this.error = "Tên công việc không được để trống";
          return;
        }
        this.error = "";
        this.tasks.push({ id: this.nextId++, title, done: false });
        this.newTask = "";
      },
      removeTask(id) {
        this.tasks = this.tasks.filter(t => t.id !== id);
      },
      clearDone() {
        this.tasks = this.tasks.filter(t => !t.done);
      }
    }
  }).mount("#app");
</script>
</body>
</html>
