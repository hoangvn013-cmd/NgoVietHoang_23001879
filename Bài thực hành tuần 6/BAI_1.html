<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bài 1 - Thẻ sinh viên</title>
<script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
<style>
  body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 30px; }
  .card { background: #fff; padding: 24px; border-radius: 10px; width: 360px; box-shadow: 0 2px 8px rgba(0,0,0,.1); text-align: center; }
  img { width: 110px; height: 110px; border-radius: 50%; }
  p { margin: 8px 0; }
  .gioi { color: green; }
  .kha { color: blue; }
  .tb { color: orange; }
  .chuadat { color: red; }
  .intro { background: #f0f2f5; padding: 10px; border-radius: 6px; }
  button { padding: 8px 14px; cursor: pointer; }
</style>
</head>
<body>
<div id="app" class="card">
  <img :src="student.avatar" :alt="'Ảnh của ' + student.name">
  <h2>{{ student.name }}</h2>
  <p>Mã SV: {{ student.id }}</p>
  <p>Lớp: <span v-text="student.className"></span></p>
  <p>Điểm TB: <input type="number" min="0" max="10" step="0.1" v-model.number="student.gpa" style="width:60px"></p>
  <p>Xếp loại: <b :class="grade.cls">{{ grade.label }}</b></p>
  <p v-if="student.isStudying">Đang học</p>
  <p v-else>Đã nghỉ</p>

  <button @click="showIntro = !showIntro">{{ showIntro ? 'Ẩn' : 'Hiện' }} giới thiệu</button>
  <p class="intro" v-show="showIntro">{{ student.intro }}</p>
</div>

<script>
  Vue.createApp({
    data() {
      return {
        showIntro: true,
        student: {
          id: "SV001",
          name: "Nguyễn Văn An",
          className: "CNTT K18A",
          avatar: "https://placehold.co/110x110?text=An",
          gpa: 7.8,
          isStudying: true,
          intro: "Sinh viên năm hai, thích lập trình web."
        }
      };
    },
    computed: {
      grade() {
        const g = this.student.gpa;
        if (g >= 8) return { label: "Giỏi", cls: "gioi" };
        if (g >= 6.5) return { label: "Khá", cls: "kha" };
        if (g >= 5) return { label: "Trung bình", cls: "tb" };
        return { label: "Chưa đạt", cls: "chuadat" };
      }
    }
  }).mount("#app");
</script>
</body>
</html>
